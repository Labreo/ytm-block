<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTM Block Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-black: #030303;
      --panel-dark: #0f0f0f;
      --card-bg: #1f1f1f;
      --border-color: #2e2e2e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --ytm-red: #ff0033;
      --ytm-red-hover: #cc002a;
      --ytm-red-glow: rgba(255, 0, 51, 0.2);
      --green-glow: rgba(16, 185, 129, 0.15);
      --font-family: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      width: 360px;
      background-color: var(--bg-black);
      color: var(--text-main);
      padding: 14px;
      font-size: 13px;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444444;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 0 3px var(--ytm-red));
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--ytm-red);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 600;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 4px;
      height: 4px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 4px #10b981;
      animation: pulse 2s infinite;
    }

    /* Now Playing Panel */
    .now-playing-panel {
      background-color: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.25s ease;
    }

    .now-playing-panel.active {
      border-color: rgba(255, 0, 51, 0.25);
      background: linear-gradient(to bottom, var(--panel-dark), rgba(255, 0, 51, 0.02));
    }

    .now-playing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .now-playing-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .live-badge {
      font-size: 8px;
      font-weight: 700;
      color: #6b7280;
      background-color: rgba(255, 255, 255, 0.02);
      padding: 1px 4px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .live-badge.live {
      color: #10b981;
      background-color: var(--green-glow);
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 2px 0;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      font-size: 11px;
    }

    .detail-label {
      width: 45px;
      color: var(--text-muted);
      font-weight: 500;
      flex-shrink: 0;
    }

    .detail-value {
      color: var(--text-main);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .action-btn {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 9px;
      font-weight: 600;
      padding: 5px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .action-btn:hover:not(:disabled) {
      background-color: rgba(255, 0, 51, 0.08);
      border-color: var(--ytm-red);
      transform: translateY(-0.5px);
    }

    .action-btn:active:not(:disabled) {
      transform: translateY(0.5px);
    }

    .action-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .action-btn.blocked {
      background-color: rgba(255, 0, 51, 0.12);
      border-color: rgba(255, 0, 51, 0.3);
      color: var(--ytm-red);
      cursor: not-allowed;
      opacity: 1;
    }

    /* Input & Search bar */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .block-input {
      flex: 1;
      background-color: var(--panel-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      outline: none;
      transition: all 0.2s ease;
    }

    .block-input:focus {
      border-color: var(--ytm-red);
      box-shadow: 0 0 6px var(--ytm-red-glow);
    }

    .block-type-select {
      background-color: var(--panel-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 11px;
      padding: 0 4px;
      outline: none;
      cursor: pointer;
    }

    .add-btn {
      background-color: var(--ytm-red);
      border: none;
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background-color: var(--ytm-red-hover);
      box-shadow: 0 0 8px var(--ytm-red-glow);
    }

    .add-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feedback-message {
      font-size: 9.5px;
      font-weight: 500;
      color: #ff5a79;
      min-height: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .feedback-message.show {
      opacity: 1;
    }

    /* Dashboard List Sections */
    .dashboard-lists {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .dashboard-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .section-icon {
      width: 12px;
      height: 12px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .count-badge {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 9px;
      font-weight: 600;
      padding: 0.5px 5px;
      border-radius: 8px;
    }

    /* Tag Grids */
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 3px 6px 3px 8px;
      border-radius: 12px;
      gap: 4px;
      max-width: 100%;
      animation: popIn 0.2s ease;
      transition: all 0.15s ease;
    }

    .pill-tag:hover {
      background-color: rgba(255, 255, 255, 0.06);
      transform: translateY(-0.5px);
    }

    .tag-text {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: capitalize;
    }

    .tag-remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5px;
      border-radius: 50%;
      transition: all 0.15s ease;
    }

    .tag-remove-btn:hover {
      color: var(--ytm-red);
      background-color: rgba(255, 0, 51, 0.1);
    }

    .section-empty-state {
      font-size: 10px;
      color: #555555;
      text-align: center;
      padding: 8px 0;
      border: 1px dashed rgba(255, 255, 255, 0.02);
      border-radius: 6px;
    }

    /* Animations */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Header with title & status -->
    <header class="header">
      <div class="logo-group">
        <svg class="logo-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <circle cx="256" cy="256" r="230" fill="#121212" stroke="#FF0033" stroke-width="6"/>
          <circle cx="256" cy="256" r="140" fill="none" stroke="#FF0033" stroke-width="26"/>
          <line x1="157" y1="157" x2="355" y2="355" stroke="#FF0033" stroke-width="26" stroke-linecap="round"/>
          <polygon points="215,185 215,327 315,256" fill="#FFFFFF" opacity="0.9"/>
        </svg>
        <h1 class="logo-text">YTM <span>Block</span></h1>
      </div>
      <div class="status-badge" title="Listening to music.youtube.com">
        <div class="status-dot"></div>
        <span>Active</span>
      </div>
    </header>

    <!-- Glassmorphic Now Playing Panel -->
    <section id="nowPlayingPanel" class="now-playing-panel">
      <div class="now-playing-header">
        <span class="now-playing-title">Currently Playing</span>
        <span id="playingStatusText" class="live-badge">Disconnected</span>
      </div>
      <div class="track-details">
        <div class="detail-row">
          <span class="detail-label">Track</span>
          <span id="currentTitleText" class="detail-value">Open YouTube Music tab</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Artist</span>
          <span id="currentArtistText" class="detail-value">No active track</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Album</span>
          <span id="currentAlbumText" class="detail-value">No active album</span>
        </div>
      </div>
      <div class="now-playing-actions">
        <button id="blockCurrentSongBtn" class="action-btn" disabled>+ Song</button>
        <button id="blockCurrentAlbumBtn" class="action-btn" disabled>+ Album</button>
        <button id="blockCurrentArtistBtn" class="action-btn" disabled>+ Artist</button>
      </div>
    </section>

    <!-- Dual search and manual block -->
    <section class="input-section">
      <div class="input-row">
        <input 
          type="text" 
          id="blockInput" 
          class="block-input" 
          placeholder="Filter lists, or type to block..." 
          maxlength="50"
          autocomplete="off"
        >
        <select id="blockTypeSelect" class="block-type-select">
          <option value="song">Song</option>
          <option value="album">Album</option>
          <option value="artist">Artist</option>
        </select>
        <button id="addBtn" class="add-btn" title="Add item to list">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div id="feedbackMsg" class="feedback-message"></div>
    </section>

    <!-- Blocked Lists Sections -->
    <div class="dashboard-lists">
      <!-- Blocked Songs Section -->
      <section class="dashboard-section" data-category="song">
        <div class="section-header">
          <div class="section-title-group">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span class="section-title">Blocked Songs</span>
          </div>
          <span id="songCountBadge" class="count-badge">0</span>
        </div>
        <div id="songList" class="tag-group"></div>
        <div id="songEmptyState" class="section-empty-state">No blocked songs</div>
      </section>

      <!-- Blocked Albums Section -->
      <section class="dashboard-section" data-category="album">
        <div class="section-header">
          <div class="section-title-group">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="section-title">Blocked Albums</span>
          </div>
          <span id="albumCountBadge" class="count-badge">0</span>
        </div>
        <div id="albumList" class="tag-group"></div>
        <div id="albumEmptyState" class="section-empty-state">No blocked albums</div>
      </section>

      <!-- Blocked Artists Section -->
      <section class="dashboard-section" data-category="artist">
        <div class="section-header">
          <div class="section-title-group">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="section-title">Blocked Artists</span>
          </div>
          <span id="artistCountBadge" class="count-badge">0</span>
        </div>
        <div id="artistList" class="tag-group"></div>
        <div id="artistEmptyState" class="section-empty-state">No blocked artists</div>
      </section>
    </div>

    <!-- Footer with Buy Me a Coffee link -->
    <footer style="margin-top: 4px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; justify-content: center; align-items: center;">
      <a href="https://buymeacoffee.com/kakeroth" target="_blank" style="color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: color 0.15s ease;" onmouseover="this.style.color='#FFDD00'" onmouseout="this.style.color='var(--text-muted)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
        Buy me a coffee
      </a>
    </footer>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
